  }

  const c=e.target.closest('.cite');
  if(c){ const el=document.getElementById(`c${c.dataset.t}-${c.dataset.n}`);
    if(el){ document.querySelectorAll('.card.hl').forEach(x=>x.classList.remove('hl'));
      el.classList.add('hl'); el.scrollIntoView({block:'center'}); } }
});
/* ============ el chat como centro ============ */
const dock=$('#dock');
const dormir=ms=>new Promise(r=>setTimeout(r,ms));

/* Tocar una sugerencia no dispara la búsqueda de una: primero salta al
   chat y la escribe ahí, para que se entienda que todo pasa por el chat y
   que ese texto es editable antes de mandarlo. */
async function autoescribir(texto){
  const q=$('#q'), form=$('#form');
  if(QUIETO.matches){ q.value=texto; form.requestSubmit(); return; }
  form.scrollIntoView({block:'center',behavior:'smooth'});
  form.classList.add('saltando');
  setTimeout(()=>form.classList.remove('saltando'),430);
  await dormir(150);
  q.value=''; form.classList.add('tipeando');
  try{ q.focus({preventScroll:true}); }catch{ q.focus(); }
  /* Un pelo más rápido cuanto más largo el texto: una sugerencia de 40
     caracteres a 22 ms tardaría casi un segundo y se hace eterna. */
  const paso=Math.max(9,Math.min(22,Math.round(560/Math.max(1,texto.length))));
  for(let i=1;i<=texto.length;i++){ q.value=texto.slice(0,i); await dormir(paso); }
  await dormir(170);
  form.classList.remove('tipeando');
  form.requestSubmit();
}

$('#seeds').addEventListener('click',e=>{
  if(e.target.classList.contains('seed')&&!busy) autoescribir(e.target.textContent.trim());
});
thread.addEventListener('click',e=>{
  const r=e.target.closest('.chip.act');
  if(r&&!busy) autoescribir(r.dataset.q);
});

/* ---- despliegue por cercanía ---- */
/* La zona sensible se calcula desde el input y es SIEMPRE la misma, esté
   desplegado o no. Si dependiera del alto real del dock, al plegarse la
   zona se achicaría, el puntero quedaría afuera y volvería a plegarse:
   ese ida y vuelta es el parpadeo que se veía. */
const MARGEN_X=24, ALTO_ZONA=78, GRACIA=320;
let salirLuego=null, ocultarLuego=null;

function cercaDelDock(si){
  clearTimeout(salirLuego);
  if(si){ clearTimeout(ocultarLuego); dock.classList.add('revelar'); }
  /* Al salir no se pliega de una: un respiro evita que un temblor de mano
     sobre el borde lo haga desaparecer. */
  else salirLuego=setTimeout(()=>dock.classList.remove('revelar'),GRACIA);
}

window.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch') return;                 // en táctil manda la pulsación larga
  if(document.documentElement.dataset.etapa!=='hilo') return;
  /* La fila entera, no solo el form: el botón de chat nuevo va al lado y
     también tiene que mantener los controles abiertos. */
  const f=$('.fila-chat').getBoundingClientRect();
  cercaDelDock(e.clientX>=f.left-MARGEN_X && e.clientX<=f.right+MARGEN_X
            && e.clientY>=f.top-ALTO_ZONA && e.clientY<=innerHeight);
},{passive:true});

/* En el celular no hay hover: mantener apretado el input despliega los
   controles por unos segundos. */
let pulsacion=null;
function revelarControles(ms=4000){
  clearTimeout(salirLuego);
  dock.classList.add('revelar');
  clearTimeout(ocultarLuego);
  ocultarLuego=setTimeout(()=>dock.classList.remove('revelar'),ms);
}
$('#q').addEventListener('pointerdown',()=>{
  clearTimeout(pulsacion);
  pulsacion=setTimeout(revelarControles,450);       // pulsación larga
});
for(const ev of ['pointerup','pointercancel','pointerleave'])
  $('#q').addEventListener(ev,()=>clearTimeout(pulsacion));
/* Elegir género o cortar el hilo son acciones que piden ver los controles:
   mientras se usan, no se repliegan. */
dock.addEventListener('click',e=>{ if(e.target.closest('.replegable')) revelarControles(); });

async function preguntar(q){
  busy=true; $('#send').disabled=true; $('#q').value=''; $('#q').blur();
  /* Se oculta, no se elimina: `pintarModo()` escribe sobre #titulo y
     #seeds, y #seeds tiene su propio listener. Borrarlos obligaba a
     recrear el marcado y a recablear los eventos. */
  { const i=$('#intro'); if(i) i.hidden=true; }
  /* A partir de acá el chat deja de estar al centro y pasa a barra fija, y
     los controles de arriba se repliegan. */
  document.documentElement.setAttribute('data-etapa','hilo');
  pintarPlaceholder();
  $('#form').classList.add('pensando');
  turno++;

  const t=document.createElement('section');
  t.className='turn';
  t.innerHTML=`<div class="ask">${esc(q)}</div>
    <div class="chips" data-chips hidden></div>
    <div class="reply">${MARK}<div class="prose" data-prose><span class="pulse"></span></div></div>
    <div class="grid" data-grid>${'<div class="skel"></div>'.repeat(6)}</div>
    <div class="chips refine" data-refine hidden></div>`;
  thread.appendChild(t);
  t.scrollIntoView({block:'start'});

  const chips=t.querySelector('[data-chips]'), prose=t.querySelector('[data-prose]'),
        grid=t.querySelector('[data-grid]'), refine=t.querySelector('[data-refine]');
  let texto='';
  const citadas=new Set();     // qué [N] ya se destacaron en este turno

  try{
    const res=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:q,limit:8,canal:modo,genero:genero||null,historial:hilo.slice(-6)})});
    if(res.status===429){ grid.innerHTML='';
      prose.innerHTML='<p>Frená un toque: hay un límite de consultas por minuto para no saturar el modelo. Probá en unos segundos.</p>'; return; }
    if(!res.ok) throw new Error('HTTP '+res.status);

    const rd=res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf='', ev=null;
    while(true){
      const {value,done}=await rd.read(); if(done) break;
      buf+=value; const parts=buf.split('\n\n'); buf=parts.pop();
      for(const raw of parts){
        const m1=raw.match(/^event: (.+)$/m), m2=raw.match(/^data: (.+)$/m);
        if(!m1||!m2) continue; ev=m1[1]; const d=JSON.parse(m2[1]);

        if(ev==='filters'&&d.applied?.length){
          chips.hidden=false;
          chips.innerHTML=d.applied.map(a=>`<span class="chip">${esc(a)}</span>`).join('');
        }
        else if(ev==='results'){
          grid.innerHTML=d.resultados.length
            ? d.resultados.map(card).join('')
            : `<div class="empty">Nada coincide en <b>${modo==='mayorista'?'por mayor':'marcas'}</b>. Probá el otro modo o aflojá el precio.</div>`;
          vigilarPlaceholder(grid);
          if(d.resultados.length){
            imprimir(grid);
            escanear(grid);
          }
          chips.hidden=false;
          if(d.aflojados?.length) chips.insertAdjacentHTML('beforeend',
            d.aflojados.map(a=>`<span class="chip warn">sin ${esc(ES[a.split('=')[0]]||a.split('=')[0])}</span>`).join(''));
          const etq=(GENEROS.find(g=>g[0]===genero)||[])[1];
          if(genero) chips.insertAdjacentHTML('beforeend',`<span class="chip">${esc(etq)}</span>`);
          chips.insertAdjacentHTML('beforeend',
            `<span class="chip soft">${d.modo==='semantico'?'vectorial':'texto'}</span>`);
          /* Chips por EJE, con el vocabulario que realmente aparece en
             estos resultados. Antes eran genéricos ("más barato", "algo
             más clásico"); ahora son "morley", "bengalina", "tiro alto" —
             el idioma con el que se pide ropa en Argentina. */
          const ejes=d.facetas||[];
          if(ejes.length){
            refine.hidden=false;
            refine.innerHTML=ejes.map(e=>
              `<span class="eje">${esc(e.eje)}</span>`+
              e.opciones.map(o=>`<button class="chip act" type="button" data-q="${esc(o)}">${esc(o)}</button>`).join('')
            ).join('');
          } else {
            const sug=refinamientos(d.resultados);
            if(sug.length){ refine.hidden=false;
              refine.innerHTML=sug.map(x=>`<button class="chip act" type="button" data-q="${esc(x)}">${esc(x)}</button>`).join(''); }
          }
        }
        else if(ev==='answer'){
          texto+=d.text; prose.innerHTML=md(texto);
          /* El texto llega en streaming, así que las citas aparecen de a
             una: se destaca cada una en el momento en que el modelo la
             nombra, y no todas juntas al final. */
          destacarCitasNuevas(texto,citadas);
        }
        else if(ev==='error'){ prose.innerHTML=`<p>Se cortó la respuesta, pero los productos de arriba son válidos.</p>`; }
        else if(ev==='done'&&!texto){ prose.innerHTML='<p>Mirá los resultados acá abajo.</p>'; }
      }
    }
  }catch(err){
    grid.innerHTML=''; prose.innerHTML=`<p>No pude conectar con la API. ${esc(err.message)}</p>`;
  }finally{
    busy=false; $('#send').disabled=false; prose.querySelector('.pulse')?.remove();
    $('#form').classList.remove('pensando');
    apagarEscaner(grid);
    if(texto) hilo.push({pregunta:q, respuesta:texto.slice(0,400)});
    if(hilo.length>6) hilo=hilo.slice(-6);
    pintarHilo();
  }
}

/* El botón de chat nuevo aparece recién cuando hay algo que reiniciar.
   El contador de preguntas se fue: el hilo en pantalla ya lo muestra. */
function pintarHilo(){
  $('#hilo-nuevo').hidden = hilo.length===0;
  pintarPlaceholder();
}

/* ============ placeholder que se escribe solo ============ */
/* En la landing el placeholder va tipeando ejemplos, uno tras otro: muestra
   de qué se le puede hablar sin ocupar espacio con una lista. Los ejemplos
   son las mismas sugerencias del modo, así que no hay un segundo texto que
   mantener sincronizado.

   Se frena en cuanto el usuario toca el campo: competir con lo que está
   escribiendo sería insoportable. */
const ESCRIBE=52, BORRA=26, ESPERA=1700;
let cicloPlaceholder=null;

function pararPlaceholder(){
  if(cicloPlaceholder){ clearTimeout(cicloPlaceholder); cicloPlaceholder=null; }
}

function animarPlaceholder(){
  pararPlaceholder();
  const q=$('#q');
  const ejemplos=(MODOS[modo].seeds||[]).slice(0,6);
  if(QUIETO.matches||!ejemplos.length){ q.placeholder=MODOS[modo].placeholder; return; }

  let i=0, n=0, borrando=false;
  const paso=()=>{
    /* Si el usuario escribió, enfocó, o dejamos la landing, se apaga. */
    if(document.documentElement.dataset.etapa!=='inicio'
       || q.value || document.activeElement===q){ pararPlaceholder(); return; }
    const txt=ejemplos[i];
    n += borrando ? -1 : 1;
    q.placeholder=txt.slice(0,n)+(borrando?'':'|');
    let d=borrando?BORRA:ESCRIBE;
    if(!borrando && n>=txt.length){ borrando=true; d=ESPERA; q.placeholder=txt; }
    else if(borrando && n<=0){ borrando=false; i=(i+1)%ejemplos.length; d=280; }
    cicloPlaceholder=setTimeout(paso,d);
  };
  paso();
}

/* Al arrancar, el placeholder propone qué pedir; con resultados en
   pantalla, lo que se hace es refinar. */
function pintarPlaceholder(){
  const enHilo=document.documentElement.dataset.etapa==='hilo';
  if(enHilo){ pararPlaceholder(); $('#q').placeholder='Escribí para redefinir…'; }
  else animarPlaceholder();
}

/* Enfocar o escribir corta la animación y deja el texto fijo del modo. */
for(const ev of ['focus','input']) $('#q').addEventListener(ev,()=>{
  if(cicloPlaceholder){ pararPlaceholder(); $('#q').placeholder=MODOS[modo].placeholder; }
});
/* El botón de enviar se enciende solo cuando hay algo para mandar. */
$('#q').addEventListener('input',()=>
  $('#form').classList.toggle('con-texto', $('#q').value.trim().length>0));
$('#q').addEventListener('blur',()=>{
  if(!$('#q').value && document.documentElement.dataset.etapa==='inicio') animarPlaceholder();
});
$('#hilo-nuevo').addEventListener('click',()=>{
  hilo=[]; pintarHilo(); volverAlInicio(); $('#q').focus();
});

/* Empezar de cero es volver a la pantalla de arranque: se borra el hilo
   visible, reaparecen las sugerencias y el chat vuelve al centro. */
function volverAlInicio(){
  thread.querySelectorAll('.turn').forEach(t=>t.remove());
  { const i=$('#intro'); if(i) i.hidden=false; }
  document.documentElement.setAttribute('data-etapa','inicio');
  dock.classList.remove('revelar');
  turno=0;
  pintarModo();                      // repinta el intro con sus sugerencias
  window.scrollTo({top:0,behavior:'smooth'});
}

$('#form').addEventListener('submit',e=>{
  e.preventDefault(); const q=$('#q').value.trim();
  if(q&&!busy) preguntar(q);
});
boot();
</script>
