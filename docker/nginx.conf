# Límite de tasa: el túnel público expone el chat a internet, y cada
# consulta al chat consume la GPU de la máquina que corre LM Studio.
# Sin esto, una sola pestaña con un script deja el modelo saturado.
limit_req_zone $binary_remote_addr zone=chat:10m rate=6r/m;    # ~1 pregunta cada 10 s
limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;   # búsqueda: barata, más holgada
limit_conn_zone $binary_remote_addr zone=conns:10m;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  limit_conn conns 12;
  client_max_body_size 64k;          # nadie sube archivos acá

  # El HTML no se cachea: es una sola página y cada deploy la cambia.
  # Sin esto el navegador sirve la versión vieja y parece que el deploy
  # no tomó efecto.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Swagger y el esquema OpenAPI: útiles en local, no en un túnel público.
  # Publican toda la superficie de la API a cualquiera con el link.
  location ~ ^/api/(docs|redoc|openapi\.json) {
    return 404;
  }

  # el chat es lo caro: invoca al modelo local
  location /api/chat {
    limit_req zone=chat burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8080/chat;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;             # imprescindible para el streaming SSE
    proxy_read_timeout 300s;
  }

  # búsqueda y stats: solo tocan Postgres
  location /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
}
